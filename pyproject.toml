[project]
name = "pmc-pdf-downloader"
version = "0.1.0"
description = "PMC PDF 批量下载器 MCP server，支持 PoW 验证绕过"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
pmc-pdf-downloader = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pdf_core.py", "mcp_server.py"]
